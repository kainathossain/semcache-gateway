<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Gateway Dashboard</title>
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e4e4de;--a:#2f6fed;--b:#c9ccd3;--g:#1f9d6b;--o:#e08a1e}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececea;--mut:#9a9a94;--card:#1f1f22;--line:#323236;--b:#4a4d57}}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:20px;max-width:1100px;margin:auto}
h1{font-size:20px;margin:0 0 16px}h2{font-size:13px;color:var(--mut);margin:0 0 10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
td.q{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{padding:1px 7px;border-radius:9px;font-size:11px;background:var(--line)}.hit{background:var(--g);color:#fff}.large,.escalated{background:var(--o);color:#fff}
svg{width:100%;height:auto}.leg{font-size:12px;color:var(--mut)}
</style></head><body><h1>Semantic cache &amp; routing gateway</h1><div id="app">Waiting for data…</div>
<script>
const EMBED={"requests": 2000, "cost": 0.11052358000000001, "baseline_cost": 4.269882, "savings": 4.15935842, "savings_pct": 0.9741155423030426, "hit_rate": 0.785, "outcomes": {"small": 423, "hit": 1570, "large": 7}, "cost_per_1k": 0.055261790000000005, "baseline_per_1k": 2.134941, "latency": {"p50": 0.010473822999995549, "p95": 0.858, "p99": 0.898, "hit_p50": 0.009680231999998342, "miss_p50": 0.794}, "series": [{"from_id": 1, "cost": 0.03881627, "baseline": 0.217353, "hit_rate": 0.52}, {"from_id": 101, "cost": 0.00944244, "baseline": 0.219036, "hit_rate": 0.75}, {"from_id": 201, "cost": 0.0041368, "baseline": 0.215805, "hit_rate": 0.76}, {"from_id": 301, "cost": 0.0036665300000000003, "baseline": 0.206667, "hit_rate": 0.79}, {"from_id": 401, "cost": 0.0040928100000000005, "baseline": 0.207414, "hit_rate": 0.76}, {"from_id": 501, "cost": 0.00313697, "baseline": 0.218703, "hit_rate": 0.82}, {"from_id": 601, "cost": 0.0031539700000000003, "baseline": 0.207633, "hit_rate": 0.82}, {"from_id": 701, "cost": 0.00254007, "baseline": 0.208158, "hit_rate": 0.86}, {"from_id": 801, "cost": 0.0032087, "baseline": 0.21912, "hit_rate": 0.81}, {"from_id": 901, "cost": 0.00355847, "baseline": 0.193968, "hit_rate": 0.8}, {"from_id": 1001, "cost": 0.00422971, "baseline": 0.195939, "hit_rate": 0.75}, {"from_id": 1101, "cost": 0.0030504300000000002, "baseline": 0.225162, "hit_rate": 0.82}, {"from_id": 1201, "cost": 0.0034406700000000003, "baseline": 0.226413, "hit_rate": 0.81}, {"from_id": 1301, "cost": 0.00319966, "baseline": 0.200154, "hit_rate": 0.82}, {"from_id": 1401, "cost": 0.00247883, "baseline": 0.217317, "hit_rate": 0.86}, {"from_id": 1501, "cost": 0.00407823, "baseline": 0.22553700000000002, "hit_rate": 0.77}, {"from_id": 1601, "cost": 0.00424013, "baseline": 0.243612, "hit_rate": 0.77}, {"from_id": 1701, "cost": 0.00422463, "baseline": 0.203082, "hit_rate": 0.76}, {"from_id": 1801, "cost": 0.00357983, "baseline": 0.206817, "hit_rate": 0.78}, {"from_id": 1901, "cost": 0.00224843, "baseline": 0.211992, "hit_rate": 0.87}], "recent": [{"id": 2000, "query": "capital of France?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 8e-08, "latency_s": 0.01285102599999732}, {"id": 1999, "query": "What is the capital of France?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 1.4e-07, "latency_s": 0.012744249000005255}, {"id": 1998, "query": "What is the status of order 101997 and also when does it ship?", "outcome": "small", "model": "small", "similarity": 0.9246129710101401, "cost": 0.0001853, "latency_s": 0.83}, {"id": 1997, "query": "How long is the refund window?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 1.4e-07, "latency_s": 0.01268052899999816}, {"id": 1996, "query": "capital of France?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 8e-08, "latency_s": 0.01267646799999966}, {"id": 1995, "query": "What is the API rate limit?", "outcome": "hit", "model": "cache", "similarity": 0.9999999999999998, "cost": 1.2e-07, "latency_s": 0.012668797999997424}, {"id": 1994, "query": "pricing tiers available?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 1.2e-07, "latency_s": 0.01285803699999832}, {"id": 1993, "query": "What is the status of order 101992 and also when does it ship?", "outcome": "small", "model": "small", "similarity": 0.8468489892984543, "cost": 0.0001653, "latency_s": 0.766}, {"id": 1992, "query": "reset my password steps", "outcome": "hit", "model": "cache", "similarity": 1.0, "cost": 1.0000000000000001e-07, "latency_s": 0.012780740999997705}, {"id": 1991, "query": "What is the capital of France?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 1.4e-07, "latency_s": 0.012528045000000817}, {"id": 1990, "query": "What is the capital of France?", "outcome": "hit", "model": "cache", "similarity": 1.0000000000000002, "cost": 1.4e-07, "latency_s": 0.012468282000004934}, {"id": 1989, "query": "download invoice where", "outcome": "hit", "model": "cache", "similarity": 1.0, "cost": 1.0000000000000001e-07, "latency_s": 0.012629338000000986}, {"id": 1988, "query": "support hours?", "outcome": "hit", "model": "cache", "similarity": 0.8700634025722169, "cost": 6e-08, "latency_s": 0.013015363000005494}, {"id": 1987, "query": "When is support open?", "outcome": "hit", "model": "cache", "similarity": 1.0, "cost": 1.0000000000000001e-07, "latency_s": 0.013103619999999979}, {"id": 1986, "query": "Explain why exponential backoff with jitter beats fixed retries and compare the trade-offs.", "outcome": "hit", "model": "cache", "similarity": 1.0, "cost": 4.4e-07, "latency_s": 0.012745657000000962}]};
const $=s=>document.querySelector(s), usd=v=>"$"+(v<1?v.toFixed(4):v.toFixed(2)), ms=v=>Math.round(v*1000)+" ms", pct=v=>(v*100).toFixed(1)+"%";
function bars(series){const W=520,H=160,n=series.length,m=Math.max(...series.map(s=>s.baseline),1e-9),bw=W/n;
 return `<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Cost per time bucket">`+series.map((s,i)=>{
 const hb=s.baseline/m*H,h=s.cost/m*H;return `<rect x="${i*bw+2}" y="${H-hb}" width="${bw-4}" height="${hb}" fill="var(--b)"/><rect x="${i*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" fill="var(--a)"/>`}).join("")+
 `</svg><div class="leg">Grey: baseline (always large model) &nbsp; Blue: actual spend</div>`}
function line(series){const W=520,H=160,n=series.length;const pts=series.map((s,i)=>`${(i/(Math.max(n-1,1)))*W},${H-s.hit_rate*H}`).join(" ");
 return `<svg viewBox="0 0 ${W} ${H+16}" role="img" aria-label="Hit rate over time"><polyline points="${pts}" fill="none" stroke="var(--g)" stroke-width="2.5"/></svg><div class="leg">Cache hit rate over time (0–100%)</div>`}
function split(o,n){const c={hit:"var(--g)",small:"var(--a)",large:"var(--o)",escalated:"#c4452d"};let x=0;
 const segs=Object.entries(o).map(([k,v])=>{const w=v/n*100,r=`<div style="width:${w}%;background:${c[k]||'#888'}" title="${k}: ${v}"></div>`;return r}).join("");
 const lg=Object.entries(o).map(([k,v])=>`<span style="color:${c[k]}">&#9632;</span> ${k} ${pct(v/n)}`).join(" &nbsp; ");
 return `<div style="display:flex;height:26px;border-radius:6px;overflow:hidden">${segs}</div><div class="leg" style="margin-top:8px">${lg}</div>`}
function render(d){if(!d||!d.requests){$("#app").textContent="No requests yet.";return}
 const k=(l,v)=>`<div class="card kpi"><b>${v}</b><span>${l}</span></div>`;
 $("#app").innerHTML=`<div class="grid">${k("Requests",d.requests)}${k("Cache hit rate",pct(d.hit_rate))}${k("Spend",usd(d.cost))}${k("Baseline (all large)",usd(d.baseline_cost))}${k("Savings",pct(d.savings_pct)+" ("+usd(d.savings)+")")}${k("Cost / 1k requests",usd(d.cost_per_1k))}</div>
 <div class="grid">${k("Latency p50",ms(d.latency.p50))}${k("Latency p95",ms(d.latency.p95))}${k("p50 on hit",ms(d.latency.hit_p50))}${k("p50 on miss",ms(d.latency.miss_p50))}</div>
 <div class="two"><div class="card"><h2>Spend vs baseline</h2>${bars(d.series)}</div><div class="card"><h2>Hit rate</h2>${line(d.series)}</div></div>
 <div class="card" style="margin-bottom:12px"><h2>Where requests were served</h2>${split(d.outcomes,d.requests)}</div>
 <div class="card"><h2>Recent requests</h2><table><tr><th>#</th><th>Query</th><th>Outcome</th><th>Sim</th><th>Cost</th><th>Latency</th></tr>${d.recent.map(r=>`<tr><td>${r.id}</td><td class="q">${r.query.replace(/</g,"&lt;")}</td><td><span class="tag ${r.outcome}">${r.outcome}</span></td><td>${r.similarity.toFixed(2)}</td><td>${usd(r.cost)}</td><td>${ms(r.latency_s)}</td></tr>`).join("")}</table></div>`}
async function tick(){try{render(await (await fetch("/api/stats")).json())}catch(e){}}
if(EMBED){render(EMBED)}else{tick();setInterval(tick,2000)}
</script></body></html>
